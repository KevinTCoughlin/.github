name: Bug report
description: Report something that is broken.
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, follow
        https://github.com/KevinTCoughlin/.github/blob/main/SECURITY.md.
        Do not file it here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release, tag, or commit. Say "default branch" if the project has no releases.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, and anything else needed to reproduce it.
    validations:
      required: false
